name: CI

on:
  pull_request:
  push:
    branches: [main, lecture]
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assignment_cms
  ADMIN_USERNAME: admin
  PASSWORD: 123
  JWT_SECRET: ci-only-secret
  SKIP_ENV_VALIDATION: true
  CI: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assignment_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assignment_cms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright browsers for Vitest
        run: pnpm --filter @repo/ui exec playwright install chromium --with-deps

      - name: Prepare database
        run: |
          pnpm --filter @repo/db db:generate
          pnpm --filter @repo/db db:push
          pnpm --filter @repo/db exec tsx src/seed.ts

      - name: Typecheck
        run: pnpm turbo check-types

      - name: Lint
        run: pnpm turbo lint

      - name: Unit tests
        run: pnpm turbo test

      - name: Build applications
        run: pnpm turbo build

  e2e:
    name: End-to-end tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assignment_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assignment_cms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm --filter @repo/db db:generate
          pnpm --filter @repo/db db:push
          pnpm --filter @repo/db exec tsx src/seed.ts

      - name: Build applications
        run: pnpm turbo build

      - name: Install Playwright browser
        working-directory: tests/playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          